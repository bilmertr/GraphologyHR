name: graphology_hr
description: "Graphology HR — Corporate Candidate & Talent Assessment from Handwriting and Signature."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  http: ^1.2.1
  in_app_purchase: ^3.2.0
  image_picker: ^1.1.2
  crypto: ^3.0.3
  image: ^4.2.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
