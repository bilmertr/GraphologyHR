name: iOS Release Build (macOS Runner)

on:
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload IPA to App Store Connect (TestFlight)'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build & Package iOS App ()
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Signed IPA (if App Store Connect API Secrets exist)
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_PRIVATE_KEY != ''
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist || \
          flutter build ios --release --no-codesign

      - name: Build Unsigned iOS Release & Package IPA (Fallback without Secrets)
        if: env.ASC_KEY_ID == ''
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "GraphologyHR-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GraphologyHR-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect (TestFlight)
        if: inputs.upload_to_appstore == true && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_PRIVATE_KEY != ''
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios -f "$IPA_FILE" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
